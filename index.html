      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
/* ---------------- DeepSite Badge ---------------- */
.deepsite-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.5rem 0.9rem;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 12px;
  font-size: 0.9rem;
  color: #fff;
  text-decoration: none;
  position: relative;
  overflow: hidden;
  transition: background 0.3s ease, transform 0.2s ease;
}

.deepsite-badge:hover {
  background: rgba(255, 255, 255, 0.15);
  transform: scale(1.03);
}

.deepsite-logo {
  width: 20px;
  height: 20px;
}

.deepsite-badge.pulse {
  animation: badgePulse 2.5s infinite;
}

@keyframes badgePulse {
  0%   { box-shadow: 0 0 0 0 rgba(255,255,255,0.3); }
  70%  { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
}

      body {
        font-family: 'Roboto', sans-serif;
        margin: 0;
        min-height: 100vh;
        transition: background 0.8s ease, color 0.6s ease;
      }

      .header-banner {
        max-height: 180px;
        object-fit: contain;
        border-radius: 24px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
        cursor: pointer;
      }

      /* ---------------- EASY READ THEME ---------------- */
      body.theme-easyRead {
        background: linear-gradient(180deg, #8ca7fa 0%, #e6eef9 50%, #f0f4f8 100%);
        color: #222;
      }
      body.theme-easyRead header.gradient-bg {
        background: linear-gradient(135deg, #8ca7fa 0%, #5a7df5 100%);
        color: #fff;
        backdrop-filter: none;
      }
      body.theme-easyRead nav,
      body.theme-easyRead footer,
      body.theme-easyRead .robot-slideshow {
        background: #fff;
        color: #111;
        backdrop-filter: none;
        border-radius: 0.5rem;
      }

      /* ---------------- COOL LOOK THEME ---------------- */
      body.theme-coolLook {
        background: #0a0a1a;
        background-image:
          radial-gradient(circle at 20% 30%, rgba(128, 0, 255, 0.38), transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(0, 0, 255, 0.32), transparent 50%),
          radial-gradient(circle at 70% 80%, rgba(255, 0, 255, 0.22), transparent 50%),
          radial-gradient(circle at 30% 70%, rgba(0, 0, 128, 0.28), transparent 50%);
        background-blend-mode: screen;
        background-attachment: fixed;
        color: #fff;
        animation: fadeInBg 2s ease forwards, moveBlobs 60s ease-in-out infinite alternate;
      }
      body.theme-coolLook header.gradient-bg {
        background: rgba(20, 20, 60, 0.85);
        backdrop-filter: blur(6px);
        color: #fff;
      }
      body.theme-coolLook nav {
        background: rgba(10, 10, 20, 0.55);
        border-radius: 12px;
        padding: 1rem;
        margin-top: 2rem;
        backdrop-filter: blur(6px);
      }
      body.theme-coolLook .robot-slideshow {
        background: rgba(15, 15, 30, 0.75);
        backdrop-filter: blur(4px);
        padding: 1rem;
        border-radius: 0.75rem;
      }
      body.theme-coolLook footer {
        background: rgba(20, 20, 40, 0.85);
        backdrop-filter: blur(8px);
      }

      .gradient-bg {
        background: linear-gradient(135deg, #8ca7fa 0%, #5a7df5 100%);
      }

      @keyframes fadeInBg {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes moveBlobs {
        0% { background-position: 20% 30%, 80% 20%, 70% 80%, 30% 70%; }
        50% { background-position: 22% 32%, 78% 22%, 68% 78%, 32% 68%; }
        100% { background-position: 20% 30%, 80% 20%, 70% 80%, 30% 70%; }
      }

      /* ---------------- Toggle button ---------------- */
      .theme-toggle {
        position: fixed;
        top: 1rem;
        right: 1rem;
        padding: 0.5rem 0.9rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: rgba(0,0,0,0.6);
        color: #fff;
        z-index: 999;
        font-weight: 700;
        backdrop-filter: blur(4px);
      }
      @media (max-width: 480px) {
        .theme-toggle { top: 0.6rem; right: 0.6rem; padding: 0.45rem 0.7rem; font-size: 0.9rem; }
      }
    
      /* ======================================================
         NAV: sits inside the banner, then pops out into a floating bar on scroll
         (the banner itself never floats)
         ====================================================== */
      /* a backdrop-filter on the header would trap the floating nav inside it */
      header.gradient-bg { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
      .site-nav-slot { margin-top: 1.25rem; }

      /* in the banner: no panel of its own */
      body.theme-coolLook nav.site-nav,
      body.theme-easyRead nav.site-nav {
        background: transparent; padding: 0; margin: 0; border-radius: 0; border: 0; box-shadow: none; color: inherit;
        backdrop-filter: none; -webkit-backdrop-filter: none;
      }

      /* the page you're on */
      .nav-btn.nav-current {
        background-image: linear-gradient(135deg, #5a7df5, #8b5cf6);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
      }

      /* floating bar (JS adds .is-stuck once the nav scrolls past the top) */
      body.theme-coolLook nav.site-nav.is-stuck,
      body.theme-easyRead nav.site-nav.is-stuck {
        position: fixed; top: .6rem; left: 50%; z-index: 900; box-sizing: border-box;
        width: calc(100% - 1.5rem); padding: .45rem 4rem; border-radius: 1rem;
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        transform: translateX(-50%);
        animation: navPop .35s cubic-bezier(.2, .8, .2, 1) both;
      }
      body.theme-coolLook nav.site-nav.is-stuck {
        background: rgba(10, 10, 26, 0.84); border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 14px 30px -14px rgba(0, 0, 0, 0.75);
      }
      body.theme-easyRead nav.site-nav.is-stuck {
        background: rgba(255, 255, 255, 0.94); border: 1px solid rgba(30, 64, 175, 0.18);
        box-shadow: 0 12px 26px -14px rgba(30, 64, 175, 0.45);
      }
      nav.site-nav.is-stuck .nav-row {
        flex-wrap: nowrap; gap: .4rem; overflow-x: auto; scrollbar-width: none;
        justify-content: flex-start; justify-content: safe center;
      }
      nav.site-nav.is-stuck .nav-row::-webkit-scrollbar { display: none; }
      nav.site-nav.is-stuck .nav-btn {
        flex: 0 0 auto; padding: .45rem .85rem; font-size: .88rem; white-space: nowrap; border-radius: .6rem;
      }
      nav.site-nav.is-stuck .nav-btn i { margin-right: .4rem; }
      @media (min-width: 1300px) {
        body.theme-coolLook nav.site-nav.is-stuck,
        body.theme-easyRead nav.site-nav.is-stuck { width: 72rem; padding: .45rem .6rem; }
      }
      @media (max-width: 640px) {
        body.theme-coolLook nav.site-nav.is-stuck,
        body.theme-easyRead nav.site-nav.is-stuck { padding: .4rem 3.5rem .4rem .5rem; }
        nav.site-nav.is-stuck .nav-btn { padding: .4rem .7rem; font-size: .82rem; }
      }
      @keyframes navPop {
        from { opacity: 0; transform: translate(-50%, -14px) scale(.98); }
        to   { opacity: 1; transform: translate(-50%, 0) scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        body.theme-coolLook nav.site-nav.is-stuck,
        body.theme-easyRead nav.site-nav.is-stuck { animation: none; }
      }

      /* ======================================================
         Theme toggle: a round dark / light mode icon button
         ====================================================== */
      body .theme-toggle {
        top: .85rem; right: 1rem; width: 2.75rem; height: 2.75rem; padding: 0; box-sizing: border-box;
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 50%; font-size: 1.1rem; line-height: 1; cursor: pointer; color: #fff;
        background: rgba(10, 10, 26, 0.78); border: 1px solid rgba(255, 255, 255, 0.28);
        box-shadow: 0 6px 16px -6px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        transition: transform .2s ease, background .2s ease;
      }
      body .theme-toggle:hover { transform: scale(1.08); }
      body .theme-toggle:active { transform: scale(.94); }
      body .theme-toggle:focus-visible { outline: 2px solid #8ca7fa; outline-offset: 2px; }
      body.theme-coolLook .theme-toggle i { color: #fcd34d; }     /* sun */
      body.theme-easyRead .theme-toggle { background: #1e40af; border-color: rgba(255, 255, 255, 0.55); }
      body.theme-easyRead .theme-toggle:hover { background: #1d4ed8; }
      body.theme-easyRead .theme-toggle i { color: #fff; }        /* moon */
      @media (max-width: 480px) {
        body .theme-toggle { top: .88rem; right: 1rem; width: 2.5rem; height: 2.5rem; font-size: 1rem; }
      }
      @media (prefers-reduced-motion: reduce) { body .theme-toggle { transition: none; } }

    </style>

    <script>
      (function(){
        const body = document.body;
        const btn = document.querySelector('.theme-toggle');

        // default to coolLook
        body.classList.add('theme-coolLook');

        function setLabel() {
          const isCool = body.classList.contains('theme-coolLook');
          var label = isCool ? 'Switch to light mode' : 'Switch to dark mode';
          btn.innerHTML = isCool ? '<i class="fas fa-sun" aria-hidden="true"></i>' : '<i class="fas fa-moon" aria-hidden="true"></i>';
          btn.setAttribute('aria-label', label);
          btn.title = label;
        }

        btn.addEventListener('click', function() {
          body.classList.toggle('theme-coolLook');
          body.classList.toggle('theme-easyRead');
          setLabel();
        });

        setLabel();
      })();

      // Banner click animation
      document.querySelector('.header-banner').addEventListener('click', function() {
        this.style.transform = 'scale(0.98)';
        setTimeout(() => { this.style.transform = 'scale(1.02)'; }, 100);
        setTimeout(() => { this.style.transform = 'scale(1)'; }, 200);
      });

      // DeepSite ripple
      document.querySelector('.deepsite-badge').addEventListener('click', function(e) {
        e.preventDefault();
        const ripple = document.createElement('span');
        ripple.className = 'absolute bg-white opacity-30 rounded-full';
        ripple.style.width = '10px';
        ripple.style.height = '10px';
        ripple.style.left = (e.clientX - e.target.getBoundingClientRect().left - 5) + 'px';
        ripple.style.top = (e.clientY - e.target.getBoundingClientRect().top - 5) + 'px';
        ripple.style.transform = 'scale(0)';
        ripple.style.transition = 'transform 0.6s ease, opacity 0.6s ease';
        this.appendChild(ripple);
        setTimeout(() => {
          ripple.style.transform = 'scale(40)';
          ripple.style.opacity = '0';
        }, 10);
        setTimeout(() => { ripple.remove(); }, 600);
      });
    </script>
      <!-- Nav: floats on scroll -->
    <script>
      (function () {
        var nav = document.querySelector('.site-nav');
        var slot = document.querySelector('.site-nav-slot');
        if (!nav || !slot) return;
        var stuck = false, ticking = false;

        // the slot keeps the nav's natural height so nothing jumps when the nav pops out
        function measure() {
          var was = nav.classList.contains('is-stuck');
          nav.classList.remove('is-stuck');
          slot.style.minHeight = '';
          slot.style.minHeight = nav.offsetHeight + 'px';
          if (was) nav.classList.add('is-stuck');
        }
        // on narrow screens the floating bar scrolls sideways: bring the current page into view
        function centerCurrent() {
          var row = nav.querySelector('.nav-row'), cur = nav.querySelector('.nav-current');
          if (!row || !cur || row.scrollWidth <= row.clientWidth) return;
          row.scrollLeft += cur.getBoundingClientRect().left - row.getBoundingClientRect().left - (row.clientWidth - cur.offsetWidth) / 2;
        }
        function update() {
          ticking = false;
          var should = slot.getBoundingClientRect().top < 10;   // nav's spot has reached the top
          if (should !== stuck) {
            stuck = should; nav.classList.toggle('is-stuck', stuck);
            if (stuck) centerCurrent();
          }
        }
        function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', function () { measure(); onScroll(); });
        window.addEventListener('load', function () { measure(); update(); });
        // Tailwind's CDN builds its styles after first paint, so re-measure whenever the nav changes size
        if ('ResizeObserver' in window) {
          new ResizeObserver(function () {
            if (!nav.classList.contains('is-stuck')) { slot.style.minHeight = nav.offsetHeight + 'px'; update(); }
          }).observe(nav);
        }
        measure(); update();
      })();
    </script>
